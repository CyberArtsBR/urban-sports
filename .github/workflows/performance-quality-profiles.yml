name: Performance quality profiles

on:
  push:
    branches:
      - integration/ski-full-audit-fixes
      - perf/urban-runtime-assets-v2
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  BENCH_ENV: "GAMEPLAY_SECONDS=30 LONG_RUN_SECONDS=60 MODE_RUN_SECONDS=15 TRICK_RUN_SECONDS=15 RESTART_ITERATIONS=20 SELECTOR_ITERATIONS=6 SAMPLE_INTERVAL_MS=500"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build

  benchmark:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: baseline
            quality: ""
          - target: high
            quality: high
          - target: low
            quality: low
          - target: max
            quality: max
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Build benchmark target
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-artifacts
          if [ "${{ matrix.target }}" = baseline ]; then
            BASE_REF="${{ github.event.pull_request.base.sha }}"
            BASE_REF="${BASE_REF:-origin/main}"
            git worktree add --detach /tmp/urban-perf-baseline "$BASE_REF"
            ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/urban-perf-baseline/node_modules
            (cd /tmp/urban-perf-baseline && npm run build)
          else
            npm run build
          fi

      - name: Benchmark ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = baseline ]; then
            TARGET_DIR=/tmp/urban-perf-baseline
          else
            TARGET_DIR="$GITHUB_WORKSPACE"
          fi

          (cd "$TARGET_DIR" && exec "$GITHUB_WORKSPACE/node_modules/.bin/vite" preview --host 127.0.0.1 --port 4173) >"/tmp/urban-${{ matrix.target }}-preview.log" 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true; wait "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 90 ]; then
              cat "/tmp/urban-${{ matrix.target }}-preview.log" || true
              exit 1
            fi
            sleep 1
          done

          QUALITY_ARGS=()
          if [ -n "${{ matrix.quality }}" ]; then
            QUALITY_ARGS=("QUALITY_PROFILE=${{ matrix.quality }}")
          fi

          env $BENCH_ENV "${QUALITY_ARGS[@]}" \
            BASE_URL=http://127.0.0.1:4173 \
            RESULTS_PATH="$GITHUB_WORKSPACE/benchmark-artifacts/benchmark-${{ matrix.target }}.json" \
            node scripts/benchmark-ski-runtime.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-benchmark-${{ matrix.target }}
          path: benchmark-artifacts/benchmark-${{ matrix.target }}.json
          if-no-files-found: error

  compare:
    needs:
      - validate
      - benchmark
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: performance-benchmark-*
          path: benchmark-artifacts
          merge-multiple: true

      - name: Compare benchmark results
        run: |
          set -euo pipefail
          test "${{ needs.validate.result }}" = success
          test "${{ needs.benchmark.result }}" = success
          for file in benchmark-baseline.json benchmark-high.json benchmark-low.json benchmark-max.json; do
            test -s "benchmark-artifacts/$file"
          done
          node scripts/compare-performance-results.mjs \
            benchmark-artifacts/benchmark-baseline.json \
            benchmark-artifacts/benchmark-high.json \
            benchmark-artifacts/benchmark-low.json \
            benchmark-artifacts/benchmark-comparison.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-quality-benchmarks
          path: benchmark-artifacts/*.json
          if-no-files-found: error
