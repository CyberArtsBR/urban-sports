name: Release hardening lock bootstrap

on:
  push:
    branches:
      - test/urban-release-hardening-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/urban-release-hardening-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package lock once
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add deterministic npm lockfile"
          git push origin HEAD:test/urban-release-hardening-v2
