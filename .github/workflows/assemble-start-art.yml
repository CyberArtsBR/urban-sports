name: Assemble Urban start art

on:
  push:
    branches: [urban-phase-2-integration]
    paths:
      - '.tmp/start-image/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble Urban start artwork
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/start
          cat .tmp/start-image/s_*.txt | base64 -d > public/start/chimpions-urban-sports-start.webp
          test -s public/start/chimpions-urban-sports-start.webp
          echo "ea0103362455e17b95f907e790c8e2a8eaeb75d4316096414c498918c37fdb59  public/start/chimpions-urban-sports-start.webp" | sha256sum -c -
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p='public/start/chimpions-urban-sports-start.webp';
          const b=fs.readFileSync(p);
          if(b.length!==91698) throw new Error('Unexpected Urban start art size: '+b.length);
          if(b.subarray(0,4).toString()!=='RIFF'||b.subarray(8,12).toString()!=='WEBP'){
            throw new Error('Invalid WEBP signature');
          }
          console.log('Urban start artwork assembled:',b.length,'bytes');
          NODE

      - name: Switch runtime to WebP and clean staging
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/chimpions-urban-sports-start\.jpg/chimpions-urban-sports-start.webp/g' src/startScreen.js src/main.js
          rm -rf .tmp/start-image
          rm -f .github/workflows/assemble-start-art.yml

      - name: Commit assembled artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Urban Sports start screen artwork"
          git push origin urban-phase-2-integration
