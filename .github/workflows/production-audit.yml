name: Chimpions Urban Sports production desktop audit
on:
  workflow_run:
    workflows: ["Chimpions Urban Sports build and checks"]
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production-audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Audit deployed Urban Sports desktop build
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          CHIMPIONS_URBAN_SPORTS_EXPECTED_COMMIT: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
        run: node checks/production-browser.mjs

      - name: Run deployed gameplay release smoke
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        shell: bash
        run: |
          BASE_URL="${PRODUCTION_URL:-https://chimpions-urban-sports.onrender.com}" npm run smoke:production

      - name: Audit deployed MAX graphics profile
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
          QUALITY_PROFILE: max
          GRAPHICS_SAMPLE_SECONDS: "18"
          GRAPHICS_SAMPLE_INTERVAL_MS: "1000"
        shell: bash
        run: |
          BASE_URL="${PRODUCTION_URL:-https://chimpions-urban-sports.onrender.com}" npm run audit:graphics
